<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lern-Master Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --error: #ef4444;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            color: white; margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }

        .header { position: absolute; top: 20px; text-align: center; width: 100%; }
        
        .progress-container { width: 80%; height: 6px; background: #334155; border-radius: 3px; margin: 10px auto; overflow: hidden; max-width: 400px; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

        .streak-badge { font-size: 0.9rem; color: #94a3b8; margin-bottom: 5px; }
        #counter { font-size: 0.8rem; opacity: 0.6; }

        .card-container { perspective: 1000px; width: 320px; height: 400px; cursor: pointer; margin-top: 40px; }
        .card { 
            width: 100%; height: 100%; position: relative; transition: transform 0.6s; 
            transform-style: preserve-3d; border-radius: 24px;
        }
        .card.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .card-back { transform: rotateY(180deg); }

        .word { font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; outline: none; border-bottom: 2px solid transparent; transition: 0.3s; }
        .word:focus { border-bottom: 2px solid var(--primary); background: rgba(255,255,255,0.05); }

        .controls { display: flex; gap: 15px; margin-top: 40px; z-index: 10; }
        .btn {
            background: rgba(255,255,255,0.05); border: none; color: white;
            padding: 15px 20px; border-radius: 15px; cursor: pointer; transition: 0.2s;
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
        }
        .btn:active { transform: scale(0.95); }
        .btn-check { background: var(--success); }
        .btn-error { background: var(--error); }
        
        .speaker-btn { font-size: 1.8rem; margin-top: 20px; cursor: pointer; opacity: 0.6; transition: 0.2s; }
        .speaker-btn:hover { opacity: 1; transform: scale(1.1); }

        .file-controls { margin-top: 30px; }
        .btn-upload {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            color: #94a3b8;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .btn-upload:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--primary); color: white; }
    </style>
</head>
<body>

    <div class="header">
        <div class="streak-badge">Streak: <span id="streak">0</span> 🔥</div>
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        <div id="counter">Lade Liste...</div>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="word" id="enText" contenteditable="true" onclick="event.stopPropagation()">Wort</div>
                <div class="speaker-btn" id="speaker" onclick="speak(); event.stopPropagation()">🔊</div>
            </div>
            <div class="card-face card-back">
                <div class="word" id="deText" contenteditable="true" onclick="event.stopPropagation()">Übersetzung</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-error" title="Nicht gewusst" onclick="rate(false); event.stopPropagation()">❌</button>
        <button class="btn" onclick="prevWord(event)">◀</button>
        <button class="btn" onclick="nextWord(event)">▶</button>
        <button class="btn btn-check" title="Gewusst" onclick="rate(true); event.stopPropagation()">✅</button>
    </div>

    <div class="file-controls">
        <input type="file" id="fileInput" accept=".txt" onchange="loadFile(this)" style="display: none;">
        <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
            📂 Neue Liste laden (.txt)
        </button>
    </div>

    <script>
        let vocabulary = JSON.parse(localStorage.getItem('myVocab')) || [];
        let currentIndex = 0;
        let streak = 0;

        // Editor: Speichern bei Fokus-Verlust
        document.getElementById('enText').addEventListener('blur', () => saveEdit('en'));
        document.getElementById('deText').addEventListener('blur', () => saveEdit('de'));

        function saveEdit(lang) {
            if (vocabulary.length === 0) return;
            const newText = document.getElementById(lang + 'Text').innerText;
            vocabulary[currentIndex][lang] = newText;
            localStorage.setItem('myVocab', JSON.stringify(vocabulary));
        }

        function loadFile(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const lines = e.target.result.trim().split('\n');
                const newList = lines.map(line => {
                    const parts = line.split(';');
                    return parts.length >= 2 ? { en: parts[0].trim(), de: parts[1].trim(), known: false } : null;
                }).filter(i => i);
                
                if(newList.length > 0) {
                    vocabulary = newList;
                    vocabulary.sort(() => Math.random() - 0.5);
                    localStorage.setItem('myVocab', JSON.stringify(vocabulary));
                    currentIndex = 0;
                    streak = 0;
                    updateUI();
                }
            };
            reader.readAsText(input.files[0]);
        }

        function updateUI() {
            if (vocabulary.length === 0) {
                document.getElementById('counter').innerText = "Bitte Liste laden";
                return;
            }
            document.getElementById('card').classList.remove('is-flipped');
            document.getElementById('enText').innerText = vocabulary[currentIndex].en;
            document.getElementById('deText').innerText = vocabulary[currentIndex].de;
            document.getElementById('counter').innerText = `${currentIndex + 1} / ${vocabulary.length}`;
            
            const knownCount = vocabulary.filter(v => v.known).length;
            document.getElementById('progressBar').style.width = (knownCount / vocabulary.length * 100) + '%';
            document.getElementById('streak').innerText = streak;
        }

        function flipCard() { if(vocabulary.length > 0) document.getElementById('card').classList.toggle('is-flipped'); }
        
        function nextWord(e) { e?.stopPropagation(); if(vocabulary.length > 0) { currentIndex = (currentIndex + 1) % vocabulary.length; updateUI(); } }
        function prevWord(e) { e?.stopPropagation(); if(vocabulary.length > 0) { currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length; updateUI(); } }

        function rate(isKnown) {
            if (vocabulary.length === 0) return;
            vocabulary[currentIndex].known = isKnown;
            if (isKnown) {
                streak++;
                playTone(600, 0.1); 
            } else {
                streak = 0;
                playTone(200, 0.2);
            }
            localStorage.setItem('myVocab', JSON.stringify(vocabulary));
            nextWord();
        }

        function speak() {
            if (vocabulary.length === 0) return;
            const msg = new SpeechSynthesisUtterance(vocabulary[currentIndex].en);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        function playTone(freq, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.value = freq; gain.gain.value = 0.05;
                osc.start(); setTimeout(() => osc.stop(), duration * 1000);
            } catch(e) { console.log("Audio nicht unterstützt"); }
        }

        // Init
        if (vocabulary.length > 0) updateUI();

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>
</html>
