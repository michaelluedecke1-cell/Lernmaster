<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lern-Master PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            color: white; margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }

        .header { position: absolute; top: 40px; text-align: center; width: 100%; padding: 0 20px; }
        .header h1 { 
            margin: 0; font-size: 1.8rem; font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            text-transform: capitalize;
        }
        .counter { 
            font-size: 0.85rem; color: #94a3b8; margin-top: 8px; 
            background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px;
            display: inline-block;
        }
        
        .file-controls { position: absolute; top: 125px; z-index: 10; }
        button.load-btn { 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; padding: 10px 20px; 
            border-radius: 12px; font-weight: 600; cursor: pointer; 
            font-size: 0.8rem; backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .card-container { perspective: 1200px; width: 90%; max-width: 360px; height: 400px; margin-top: 60px; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
        .card.is-flipped { transform: rotateY(180deg); }
        
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 32px; padding: 30px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .card-front { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2)); backdrop-filter: blur(20px); }
        .card-back { background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.2)); backdrop-filter: blur(20px); transform: rotateY(180deg); }
        
        .vocab-text { font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; word-break: break-word; line-height: 1.2; }
        .lang-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: #94a3b8; margin-bottom: 15px; }

        .nav-buttons { display: flex; gap: 30px; margin-top: 50px; }
        .nav-btn {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); 
            color: white; width: 65px; height: 65px;
            border-radius: 20px; font-size: 1.2rem; display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: all 0.2s;
        }
        .nav-btn:active { transform: scale(0.9); background: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="mainTitle">Lern-Master</h1>
        <div id="counter" class="counter">Warte auf Daten...</div>
    </div>

    <div class="file-controls">
        <input type="file" id="fileInput" accept=".txt" style="display: none;">
        <button class="load-btn" onclick="document.getElementById('fileInput').click()">📂 Datei wählen</button>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="lang-label" id="labelFront">Frage / Begriff</div>
                <div class="vocab-text" id="enText">---</div>
            </div>
            <div class="card-face card-back">
                <div class="lang-label" id="labelBack">Antwort / Info</div>
                <div class="vocab-text" id="deText">---</div>
            </div>
        </div>
    </div>

    <div class="nav-buttons">
        <button class="nav-btn" onclick="prevWord(event)">❮</button>
        <button class="nav-btn" onclick="nextWord(event)">❯</button>
    </div>

    <script>
        let vocabulary = [];
        let currentIndex = 0;

        document.addEventListener('DOMContentLoaded', () => {
            const savedVocab = localStorage.getItem('myVocab');
            const savedTitle = localStorage.getItem('myTitle');
            if (savedVocab) {
                vocabulary = JSON.parse(savedVocab);
                if (savedTitle) document.getElementById('mainTitle').innerText = savedTitle;
                vocabulary.sort(() => Math.random() - 0.5);
                updateUI();
            }
        });

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Setzt den Titel basierend auf dem Dateinamen
            const fileName = file.name.replace('.txt', '').replace(/_/g, ' ');
            document.getElementById('mainTitle').innerText = fileName;
            localStorage.setItem('myTitle', fileName);

            const reader = new FileReader();
            reader.onload = (e) => processData(e.target.result);
            reader.readAsText(file);
        });

        function processData(text) {
            const lines = text.trim().split('\n');
            const newList = lines.map(line => {
                const parts = line.split(';');
                return parts.length >= 2 ? { en: parts[0].trim(), de: parts[1].trim() } : null;
            }).filter(item => item !== null);

            if (newList.length > 0) {
                vocabulary = newList;
                localStorage.setItem('myVocab', JSON.stringify(vocabulary));
                vocabulary.sort(() => Math.random() - 0.5);
                currentIndex = 0;
                updateUI();
            }
        }

        function updateUI() {
            if (vocabulary.length === 0) return;
            document.getElementById('card').classList.remove('is-flipped');
            document.getElementById('enText').innerText = vocabulary[currentIndex].en;
            document.getElementById('deText').innerText = vocabulary[currentIndex].de;
            document.getElementById('counter').innerText = `${currentIndex + 1} / ${vocabulary.length}`;
        }

        function flipCard() { if (vocabulary.length > 0) document.getElementById('card').classList.toggle('is-flipped'); }
        function nextWord(e) { e.stopPropagation(); if (vocabulary.length === 0) return; currentIndex = (currentIndex + 1) % vocabulary.length; updateUI(); }
        function prevWord(e) { e.stopPropagation(); if (vocabulary.length === 0) return; currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length; updateUI(); }


        // Registrierung des Service Workers
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registriert!', reg))
            .catch(err => console.log('Service Worker Fehler:', err));
    });
}
    </script>
</body>
</html>
