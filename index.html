<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lern-Master Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --error: #ef4444;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            color: white; margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }

        .header { position: absolute; top: 20px; text-align: center; width: 100%; }
        
        /* Fortschrittsbalken */
        .progress-container { width: 80%; height: 6px; background: #334155; border-radius: 3px; margin: 10px auto; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

        .streak-badge { font-size: 0.9rem; color: #94a3b8; }

        .card-container { perspective: 1000px; width: 320px; height: 400px; cursor: pointer; }
        .card { 
            width: 100%; height: 100%; position: relative; transition: transform 0.6s; 
            transform-style: preserve-3d; border-radius: 24px;
        }
        .card.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .card-back { transform: rotateY(180deg); }

        .word { font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; outline: none; }
        .word:focus { border-bottom: 2px solid var(--primary); }

        .controls { display: flex; gap: 20px; margin-top: 40px; z-index: 10; }
        .btn {
            background: rgba(255,255,255,0.05); border: none; color: white;
            padding: 15px 25px; border-radius: 15px; cursor: pointer; transition: 0.2s;
        }
        .btn-check { background: var(--success); }
        .btn-error { background: var(--error); }
        
        .speaker-btn { font-size: 1.5rem; margin-top: 15px; cursor: pointer; opacity: 0.7; }
        .speaker-btn:hover { opacity: 1; }

        input[type="file"] { display: none; }
        .upload-label { font-size: 0.8rem; color: #64748b; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Lern-Master</h1>
        <div class="streak-badge">Streak: <span id="streak">0</span> 🔥</div>
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        <div id="counter">0 / 0</div>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="word" id="enText" contenteditable="true" onclick="event.stopPropagation()">Wort</div>
                <div class="speaker-btn" onclick="speak(); event.stopPropagation()">🔊</div>
            </div>
            <div class="card-face card-back">
                <div class="word" id="deText" contenteditable="true" onclick="event.stopPropagation()">Übersetzung</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-error" onclick="rate(false); event.stopPropagation()">❌</button>
        <button class="btn" onclick="prevWord(event)">◀</button>
        <button class="btn" onclick="nextWord(event)">▶</button>
        <button class="btn btn-check" onclick="rate(true); event.stopPropagation()">✅</button>
    </div>

    <label class="upload-label">
        Neue Liste laden (.txt)
        <input type="file" accept=".txt" onchange="loadFile(this)">
    </label>

    <script>
        let vocabulary = JSON.parse(localStorage.getItem('myVocab')) || [];
        let currentIndex = 0;
        let streak = 0;

        // Editor-Funktion
        document.getElementById('enText').addEventListener('blur', () => saveEdit('en'));
        document.getElementById('deText').addEventListener('blur', () => saveEdit('de'));

        function saveEdit(lang) {
            if (vocabulary.length === 0) return;
            const newText = document.getElementById(lang + 'Text').innerText;
            vocabulary[currentIndex][lang] = newText;
            localStorage.setItem('myVocab', JSON.stringify(vocabulary));
        }

        function loadFile(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const lines = e.target.result.trim().split('\n');
                vocabulary = lines.map(line => {
                    const parts = line.split(';');
                    return parts.length >= 2 ? { en: parts[0].trim(), de: parts[1].trim(), known: false } : null;
                }).filter(i => i);
                localStorage.setItem('myVocab', JSON.stringify(vocabulary));
                updateUI();
            };
            reader.readAsText(input.files[0]);
        }

        function updateUI() {
            if (vocabulary.length === 0) return;
            document.getElementById('card').classList.remove('is-flipped');
            document.getElementById('enText').innerText = vocabulary[currentIndex].en;
            document.getElementById('deText').innerText = vocabulary[currentIndex].de;
            document.getElementById('counter').innerText = `${currentIndex + 1} / ${vocabulary.length}`;
            
            const knownCount = vocabulary.filter(v => v.known).length;
            document.getElementById('progressBar').style.width = (knownCount / vocabulary.length * 100) + '%';
            document.getElementById('streak').innerText = streak;
        }

        function flipCard() { if(vocabulary.length > 0) document.getElementById('card').classList.toggle('is-flipped'); }
        
        function nextWord(e) { e?.stopPropagation(); currentIndex = (currentIndex + 1) % vocabulary.length; updateUI(); }
        function prevWord(e) { e?.stopPropagation(); currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length; updateUI(); }

        function rate(isKnown) {
            if (vocabulary.length === 0) return;
            vocabulary[currentIndex].known = isKnown;
            if (isKnown) {
                streak++;
                playTone(600, 0.1); // Erfolgssound
            } else {
                streak = 0;
                playTone(200, 0.2); // Fehler
            }
            nextWord();
        }

        function speak() {
            const msg = new SpeechSynthesisUtterance(vocabulary[currentIndex].en);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        function playTone(freq, duration) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = freq; gain.gain.value = 0.1;
            osc.start(); setTimeout(() => osc.stop(), duration * 1000);
        }

        // Initialer Check
        if (vocabulary.length > 0) updateUI();

        // SW Registrierung
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>
</html>
